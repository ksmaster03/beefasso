name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-7
      INSTANCE_ID: i-02cb354e2428d3dbe
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Send deploy command via SSM
        id: send
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GH Actions deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "set -euxo pipefail",
              "cd /opt/beefasso",
              "sudo -u ec2-user git fetch origin main",
              "sudo -u ec2-user git reset --hard origin/main",
              "sudo -u ec2-user /usr/local/bin/bun install --frozen-lockfile",
              "sudo -u ec2-user /usr/local/bin/bun run build",
              "systemctl restart beefasso",
              "sleep 3",
              "systemctl is-active beefasso",
              "curl -sf http://localhost:3000/api/health"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD" >> "$GITHUB_OUTPUT"
          echo "SSM command id: $CMD"

      - name: Wait for completion
        run: |
          set -euo pipefail
          CMD="${{ steps.send.outputs.command_id }}"
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success) echo "Deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$CMD" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text | tail -50
                echo "Deploy failed with status: $STATUS"; exit 1 ;;
            esac
            sleep 5
          done

      - name: Show deploy log tail
        if: always()
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -30 || true
